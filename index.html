<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Rust Browser Term</title>

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
        />
        <script type="importmap">
            {
                "imports": {
                    "xterm": "https://cdn.jsdelivr.net/npm/xterm@5.3.0/+esm",
                    "xterm-addon-fit": "https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/+esm"
                }
            }
        </script>
        <link rel="rust" data-bin="chaeby" href="Cargo.toml" />

        <style>
            body {
                background: #000;
                margin: 0;
                padding: 20px;
            }
            /* Make sure the terminal container has a size */
            #terminal {
                height: 90vh;
                width: 100%;
            }
        </style>
    <link rel="modulepreload" href="/chaeby/chaeby.js" crossorigin="anonymous"><link rel="preload" href="/chaeby/chaeby_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
    <body>
        <div id="terminal"></div>
    
<script type="module">
import init, * as bindings from '/chaeby/chaeby.js';
const wasm = await init({ module_or_path: '/chaeby/chaeby_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script></body>
</html>
